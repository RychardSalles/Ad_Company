<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - AD Company</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/produtos.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Header repetido (simplificado para o exemplo) -->
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo"><h2>AD Company</h2></a>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="produtos.html">Todos os Tênis</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <a href="carrinho.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
            </div>
        </div>
    </header>

    <main class="container page-layout">
        <aside class="filters">
            <h3>Filtros</h3>
            <div class="filter-group">
                <label>Busca</label>
                <input type="text" id="filter-search" placeholder="Nome do tênis...">
            </div>
            <div class="filter-group">
                <label>Apenas Promoções</label>
                <input type="checkbox" id="filter-promo">
            </div>
            <button id="apply-filters" class="btn btn-secondary">Aplicar Filtros</button>
        </aside>
        
        <section class="products-list">
            <div class="products-header">
                <h2>Todos os Tênis</h2>
                <select id="sort-select">
                    <option value="recent">Mais recentes</option>
                    <option value="price_asc">Menor Preço</option>
                    <option value="price_desc">Maior Preço</option>
                </select>
            </div>
            <div class="product-grid" id="products-grid">
                <p>Carregando produtos...</p>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/carrinho.js"></script>
    <script src="js/produtos.js"></script>
</body>
</html>
