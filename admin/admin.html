<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - AD Company</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .error-msg {
            color: #e74c3c;
            margin-top: 10px;
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #f4f4f4;">
    <div class="login-container">
        <h2>Painel Administrativo</h2>
        <form id="login-form">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Entrar</button>
            <p id="error-message" class="error-msg">E-mail ou senha incorretos.</p>
        </form>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');
            const btn = e.target.querySelector('button');

            btn.textContent = 'Entrando...';
            errorMsg.style.display = 'none';

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Credenciais inválidas.';
                btn.textContent = 'Entrar';
            } else {
                window.location.href = 'dashboard.html';
            }
        });

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        }
        checkSession();
    </script>
</body>
</html>
