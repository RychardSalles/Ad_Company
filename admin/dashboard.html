<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AD Company</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--primary); color: white; padding: 20px; }
        .sidebar h2 { margin-bottom: 30px; font-size: 1.5rem; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar ul li { margin-bottom: 15px; }
        .sidebar ul li a { color: white; text-decoration: none; font-weight: bold; }
        .main-content { flex: 1; padding: 30px; background: #f4f4f4; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 1rem; color: var(--text-light); }
        .stat-card p { margin: 0; font-size: 2rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <h2>Admin Painel</h2>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="#" id="logout-btn">Sair</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <h1>Visão Geral</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total de Produtos</h3>
                    <p id="total-produtos">Carregando...</p>
                </div>
            </div>
            <!-- Pode adicionar mais funcionalidades aqui futuramente -->
        </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script>
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
            }
        }
        checkSession();

        document.getElementById('logout-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        });

        async function loadDashboard() {
            const { count, error } = await supabase
                .from('products')
                .select('*', { count: 'exact', head: true });
            
            if (!error) {
                document.getElementById('total-produtos').textContent = count;
            } else {
                document.getElementById('total-produtos').textContent = 'Erro';
            }
        }
        loadDashboard();
    </script>
</body>
</html>
