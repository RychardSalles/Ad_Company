<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto - AD Company</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #16284c;
            --text-main: #222222;
            --text-light: #666666;
            --bg-body: #ffffff;
            --danger: #c4262e;
            --border: #eeeeee;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background: var(--bg-body); color: var(--text-main); }
        a { text-decoration: none; color: inherit; }

        /* Header Minimalista */
        header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .logo { width: 120px; }
        .nav-links { display: flex; gap: 30px; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
        .nav-icons { display: flex; gap: 20px; font-size: 20px; }

        /* Container Principal: 3 Colunas como na referência */
        .product-container { max-width: 1400px; margin: 60px auto; padding: 0 40px; display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 60px; }

        /* Coluna 1: Info e Descrição */
        .product-info-left { display: flex; flex-direction: column; gap: 20px; }
        .product-title { font-family: var(--font-sans); font-weight: 600; font-size: 24px; line-height: 1.2; text-align: center; }
        .product-price { font-size: 18px; font-weight: 500; text-align: center; }
        .product-desc { font-size: 12px; line-height: 1.8; color: var(--text-light); margin-top: 20px; text-align: center; }

        /* Coluna 2: Galeria (Carrossel) */
        .product-gallery { position: relative; display: flex; align-items: center; justify-content: center; background: #ffffff; border-radius: 8px; overflow: hidden; min-height: 500px; }
        .gallery-img { width: 100%; height: 100%; object-fit: contain; position: absolute; top:0; left:0; opacity: 0; transition: opacity 0.3s ease; }
        .gallery-img.active { opacity: 1; z-index: 2; position: relative; }
        
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: transparent; border: none; font-size: 24px; cursor: pointer; z-index: 10; padding: 20px; color: #000; font-weight: bold; }
        .nav-btn.prev { left: 0px; }
        .nav-btn.next { right: 0px; }

        /* Coluna 3: Compra */
        .product-checkout { display: flex; flex-direction: column; gap: 30px; }
        
        .size-selector { display: flex; gap: 10px; flex-wrap: wrap; }
        .size-btn { border: 1px solid var(--border); background: white; padding: 15px 0; cursor: pointer; font-family: var(--font-sans); font-size: 12px; transition: all 0.2s; flex: 1; text-align: center; min-width: 60px; }
        .size-btn:hover { border-color: var(--text-main); }
        .size-btn.selected { background: var(--text-main); color: white; border-color: var(--text-main); }

        .btn-add-cart { background: var(--text-main); color: white; border: none; padding: 18px; font-size: 13px; font-family: var(--font-sans); font-weight: 500; cursor: pointer; transition: 0.3s; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-add-cart:hover { background: #000; }

        .accordion { border-top: 1px solid var(--border); margin-top: 20px; }
        .accordion-item { border-bottom: 1px solid var(--border); }
        .accordion-header { padding: 20px 0; display: flex; justify-content: space-between; cursor: pointer; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        @media (max-width: 1024px) {
            .product-container { grid-template-columns: 1fr; gap: 40px; }
            .product-gallery { order: -1; min-height: 400px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <img src="assets/logo.png" alt="AD Company" style="width: 100%;">
        </a>
        <nav class="nav-links">
            <a href="produtos.html">Shop</a>
        </nav>
        <div class="nav-icons">
            <a href="carrinho.html" style="font-size: 14px; font-weight: 600;">CARRINHO <span id="cart-count">(0)</span></a>
        </div>
    </header>

    <main class="product-container" id="product-page">
        <p style="grid-column: 2; text-align: center;">Carregando produto...</p>
    </main>

    <script src="js/config.js"></script>
    <script>
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const formatCurrency = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');

            if (!productId) {
                document.getElementById('product-page').innerHTML = '<p style="grid-column: 2; text-align: center;">Produto não encontrado.</p>';
                return;
            }

            const { data: product, error } = await supabase.from('products').select('*').eq('id', productId).single();

            if (error || !product) {
                document.getElementById('product-page').innerHTML = '<p style="grid-column: 2; text-align: center;">Erro ao carregar o produto.</p>';
                return;
            }

            let sizes = ["P", "M", "G", "GG"]; 
            let descText = product.description || "Design exclusivo e material de alta qualidade.";
            
            if(product.description && product.description.includes('Tamanhos:')) {
                const sizeMatch = product.description.match(/Tamanhos: (.*?)( \\n|$)/);
                if(sizeMatch && sizeMatch[1]) sizes = sizeMatch[1].split(',').map(s => s.trim());
                descText = product.description.split('\\nTamanhos')[0].replace(/\\n/g, '<br>');
            }

            const priceHtml = product.is_promo ? 
                `<span style="text-decoration: line-through; color: #999; font-size: 14px;">${formatCurrency(product.price)}</span> ${formatCurrency(product.promo_price)}` : 
                formatCurrency(product.price);

            const html = `
                <!-- Coluna 1: Info -->
                <div class="product-info-left">
                    <h1 class="product-title">${product.name}</h1>
                    <div class="product-price">${priceHtml}</div>
                    <div class="product-desc">
                        <p>${descText}</p>
                    </div>
                </div>

                <!-- Coluna 2: Galeria -->
                <div class="product-gallery">
                    <button class="nav-btn prev" onclick="changeImage(-1)">❮</button>
                    <!-- Imagem 1: Original -->
                    <img src="${product.image_url}" class="gallery-img active" alt="${product.name}">
                    <!-- Imagem 2: Placeholder simulando verso/detalhe -->
                    <img src="${product.image_url}" class="gallery-img" style="transform: scaleX(-1);" alt="${product.name} verso">
                    <button class="nav-btn next" onclick="changeImage(1)">❯</button>
                </div>

                <!-- Coluna 3: Compra -->
                <div class="product-checkout">
                    <div class="size-selector" id="size-container">
                        ${sizes.map(s => `<button class="size-btn" onclick="selectSize(this, '${s}')">${s}</button>`).join('')}
                    </div>
                    
                    <button class="btn-add-cart" onclick="addToCart('${product.id}', '${product.name}', ${product.is_promo ? product.promo_price : product.price}, '${product.image_url}')">
                        Adicionar ao carrinho
                    </button>

                    <div class="accordion">
                        <div class="accordion-item">
                            <div class="accordion-header">Medidas <span>˅</span></div>
                        </div>
                        <div class="accordion-item">
                            <div class="accordion-header">Prazo <span>˅</span></div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('product-page').innerHTML = html;
        });

        let currentImg = 0;
        window.changeImage = function(direction) {
            const images = document.querySelectorAll('.gallery-img');
            if(images.length <= 1) return;
            
            images[currentImg].classList.remove('active');
            currentImg = (currentImg + direction + images.length) % images.length;
            images[currentImg].classList.add('active');
        };

        let selectedSize = null;
        window.selectSize = function(btn, size) {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedSize = size;
        };

        window.addToCart = function(id, name, price, img) {
            if(!selectedSize) { alert('Por favor, selecione um tamanho antes de adicionar ao carrinho.'); return; }
            
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            const existingItem = cart.find(item => item.product.id === id && item.variant.size === selectedSize);
            if(existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    product: { id, name, price, image_url: img },
                    variant: { size: selectedSize, color: 'Padrão' },
                    quantity: 1
                });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            alert('Produto adicionado ao carrinho!');
            
            const countEl = document.getElementById('cart-count');
            if(countEl) {
                const total = cart.reduce((acc, item) => acc + item.quantity, 0);
                countEl.textContent = `(${total})`;
            }
        };
    </script>
</body>
</html>
